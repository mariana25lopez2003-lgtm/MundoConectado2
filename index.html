<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mundo Conectado</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #87ceeb;
            font-family: Arial, sans-serif;
        }

        #juego {
            width: 100vw;
            height: 100vh;
        }

        #mensaje {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            background: rgba(0,0,0,0.7);
            color: white;

            padding: 20px 30px;
            border-radius: 15px;

            font-size: 20px;
            text-align: center;
        }

        #titulo {
            position: fixed;
            top: 15px;
            left: 20px;

            color: white;
            font-size: 25px;
            font-weight: bold;

            text-shadow: 2px 2px 4px black;
        }
    </style>
</head>

<body>

    <div id="juego"></div>

    <div id="titulo">
        🌎 Mundo Conectado
    </div>

    <div id="mensaje">
        🎮 ¡Nuestro mundo está comenzando!<br><br>
        Próximamente podrás explorar, construir<br>
        y responder preguntas para conseguir herramientas.
    </div>

</body>
</html>
